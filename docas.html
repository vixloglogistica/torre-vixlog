<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docas · Controle de Pátio Vix Log</title>
<link rel="icon" href="icone-vixlog.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pátio Vix Log">
<link rel="stylesheet" href="tema.css">
<style>
  /* layout das docas — cores e fontes vêm de tema.css. TV: painel de placas; celular (< 1000 px): cartões */
  *{box-sizing:border-box} html,body{margin:0;min-height:100%}
  html{font-size:16px} @media (min-width:1000px){html{font-size:calc(100vw / 120)}}
  body{display:flex;flex-direction:column;gap:.8rem;padding:.8rem 1.1rem}
  @media (min-width:1000px){body{height:100vh;overflow:hidden}}
  header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  header img{height:3.4rem}
  header h1{font:800 2.8rem/1 var(--f-titulo);letter-spacing:.04em;margin:0}
  header small{display:block;font:700 1rem/1 var(--f-texto);letter-spacing:.24em;color:var(--mut);margin-bottom:.35rem}
  .res{margin-left:auto;display:flex;gap:.8rem;flex-wrap:wrap;justify-content:flex-end}
  .res span{display:flex;align-items:baseline;gap:.5rem;background:var(--panel);border:1px solid var(--linha);border-bottom:.3rem solid currentColor;border-radius:.6rem;padding:.35rem 1rem;font:700 1.15rem var(--f-texto)}
  .res b{font:800 2.6rem/1 var(--f-titulo)}
  main{flex:1;min-height:0;background:var(--panel);border:1px solid var(--linha);border-radius:.6rem;overflow:hidden;display:flex;flex-direction:column}
  .cab,.doca{display:grid;grid-template-columns:7.5rem 13rem 34.6rem 12.5rem 6rem 7.4rem minmax(0,1fr);column-gap:1.2rem;align-items:center;padding:0 1.3rem}
  .cab{height:3rem;flex:none;border-bottom:2px solid var(--linha);font:700 1.02rem/1 var(--f-texto);letter-spacing:.2em;color:var(--mut)}
  .lista{flex:1;display:flex;flex-direction:column;min-height:0}
  .doca{flex:1;min-height:6rem;border-bottom:1px solid color-mix(in srgb,var(--linha) 70%,transparent)}
  .doca:nth-child(even){background:rgba(255,255,255,.022)}
  .doca.ocup{background:linear-gradient(90deg,color-mix(in srgb,var(--s-noshow) 9%,transparent),transparent 45%)}
  .doca>span{display:flex;align-items:center;gap:.5rem;min-width:0;flex-wrap:wrap}
  .doca .nome{flex-direction:column;align-items:flex-start;gap:.35rem}
  .z-dn{--w:3.1rem;--h:4.9rem;--fs:4rem;--gp:.14rem;--cc:var(--marca);--fs-s:2.4rem}
  .z-tr{--w:1.22rem;--h:2.7rem;--fs:2.1rem;--fs-s:1.35rem}
  .z-cl{--w:.98rem;--h:2.1rem;--fs:1.55rem;--cc:var(--txt2);--fs-s:1rem}
  .z-hr{--w:1.05rem;--h:2.3rem;--fs:1.65rem;--fs-s:1rem}
  .z-tm{--w:1.15rem;--h:2.5rem;--fs:1.9rem;--cc:var(--txt);--fs-s:1.6rem}
  .sts{font-size:1.45rem;height:3.1rem}
  .op{font:800 1.15rem/1 var(--f-titulo);letter-spacing:.08em;background:var(--txt);color:var(--bg);padding:.35rem .55rem;border-radius:.3rem}
  .conf{font:600 1.15rem/1.2 var(--f-texto);color:var(--mut)}
  .conf b{color:var(--txt)}
  .livre-t{font:600 1.15rem var(--f-texto);color:var(--mut)}
  .fila{display:flex;gap:2rem;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--linha);border-radius:.6rem;padding:.6rem 1.3rem;font:500 1.25rem var(--f-texto);color:var(--mut)}
  .fila b{font:800 1.8rem var(--f-titulo);color:var(--txt);margin-right:.25rem}
  #rel{margin-left:auto}
  #erro{display:none}
  .vazio{margin:auto;padding:2rem}
  /* celular / tela estreita: um cartão por doca */
  @media (max-width:999px){
    header h1{font-size:2rem} header img{height:2.6rem} .res{margin-left:0;justify-content:flex-start} .res b{font-size:1.8rem}
    .cab{display:none}
    .lista{gap:.6rem;padding:.6rem}
    main{background:transparent;border:0}
    .doca{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"n s" "n nome" "n op" "n tempo" "n conf";gap:.35rem .9rem;padding:.9rem 1rem;border:1px solid var(--linha);border-left:.45rem solid var(--c);border-radius:.6rem;background:var(--panel);min-height:0}
    .doca:nth-child(even){background:var(--panel)}
    .doca>span:nth-child(1){grid-area:n;align-self:start} .doca>span:nth-child(2){grid-area:s} .doca>span:nth-child(3){grid-area:nome}
    .doca>span:nth-child(4){grid-area:op} .doca>span:nth-child(5){grid-area:tempo} .doca>span:nth-child(6){grid-area:tempo;justify-self:end} .doca>span:nth-child(7){grid-area:conf}
    .sts{font-size:1.1rem;height:2.3rem}
    .fila{font-size:1rem;gap:.6rem 1.2rem} .fila b{font-size:1.3rem} #rel{margin-left:0}
  }
</style>
</head>
<body>
<header><img src="logo-vixlog.svg" alt="Vix Log"><div><small>CONTROLE DE PÁTIO · SÓ VISUALIZAÇÃO</small><h1>DOCAS</h1></div><div class="res" id="res"></div></header>
<div id="erro" class="aviso-erro"></div>
<main><div class="cab"><span>DOCA</span><span>SITUAÇÃO</span><span>TRANSPORTADORA / CLIENTE</span><span>OPERAÇÃO</span><span>DESDE</span><span>TEMPO</span><span>CONFERENTE</span></div><div class="lista" id="docas"><div class="vazio carregando">CARREGANDO…</div></div></main>
<div class="fila"><span id="fila"></span><span id="rel"></span></div>
<script src="config.js"></script>
<script src="placas.js"></script>
<script>
const CFG = Object.assign({api:'', docas:5}, window.TORRE_CONFIG||{});
const Q = new URLSearchParams(location.search);
const NDOCAS = Math.max(1, parseInt(Q.get('docas')||CFG.docas, 10) || 5);
const DEMO = Q.has('demo');
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let TOKEN = Q.get('t') || ''; if (TOKEN) { lsSet('torre_t', TOKEN); } else TOKEN = lsGet('torre_t') || '';
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const quando = s => { if(!s) return null; const t = Date.parse(String(s).replace(' ','T')); return isNaN(t)?null:new Date(t); };
const dur = ms => { const m = Math.max(0, Math.round(ms/60000)); return m<60 ? m+' min' : Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'); };
const hhmm = s => { const d = quando(s); return d ? String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') : ''; };
const primeiro = s => String(s||'').split(/\s+/)[0] || '';
const bonito = s => String(s||'').toLowerCase().replace(/(^|\s)\S/g, c=>c.toUpperCase());
let ITENS = [];

function demo(){
  const min = m => { const d = new Date(Date.now()-m*60000), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:00`; };
  return [
    {id:1,funil:'rec',etapa:'em_andamento',transportadora:'Jomed Transportes',cliente:'Semina Industria e Comercio Ltda',doca:'01',inicio:min(35),operacao:'Descarga',conferente:'Mateus Santos'},
    {id:2,funil:'exp',etapa:'em_andamento',transportadora:'Volix',cliente:'Fitlog',doca:'03',inicio:min(12),operacao:'',conferente:''},
    {id:3,funil:'rec',etapa:'em_andamento',transportadora:'Transgarra Operações Logísticas',cliente:'GRF Distribuicao',doca:'04',inicio:min(70),operacao:'Descarga',conferente:'Greziele Nascimento'},
    {id:4,funil:'rec',etapa:'aguardando_doca',transportadora:'Naga',cliente:'Delly',chegada:min(18)},
    {id:5,funil:'rec',etapa:'apresentou',transportadora:'Rapido',cliente:'Lebon',chegada:min(4)},
    {id:6,funil:'rec',etapa:'em_andamento',transportadora:'Cross Log',cliente:'Hello Brasil',doca:'',inicio:min(20),operacao:'Crossdocking'},
  ];
}
async function carregar(){
  const er = document.getElementById('erro');
  try{
    if (DEMO) ITENS = demo();
    else {
      const r = await fetch(`${CFG.api.replace(/\/$/,'')}/?t=${encodeURIComponent(TOKEN)}`, {cache:'no-store'});
      if (r.status===401) throw new Error('Senha inválida — abra o link com ?t=SUA_SENHA');
      if (!r.ok) throw new Error('Erro ' + r.status);
      ITENS = (await r.json()).itens || [];
    }
    er.style.display='none'; desenhar();
  }catch(e){ er.textContent='⚠ '+(e.message||e)+' — tentando de novo…'; er.style.display='block'; }
}
const num = v => { const n = parseInt(String(v||'').replace(/\D/g,''), 10); return isNaN(n)?0:n; };
function desenhar(){
  const emOp = ITENS.filter(i=>i.etapa==='em_andamento');
  const porDoca = {}; emOp.forEach(i=>{ const n = num(i.doca); if (n) (porDoca[n] = porDoca[n]||[]).push(i); });
  const semDoca = emOp.filter(i=>!num(i.doca));
  let ocup = 0;
  const box = document.getElementById('docas');
  if (box.dataset.n !== String(NDOCAS) || box.dataset.s !== String(Placas.simples())){
    box.dataset.n = NDOCAS; box.dataset.s = Placas.simples();
    box.innerHTML = Array.from({length:NDOCAS},(_,k)=>`<section class="doca" data-d="${k+1}">
      <span>${Placas.html(2,String(k+1).padStart(2,'0'),'z-dn tnum')}</span><span><span class="sts"></span></span>
      <span class="nome">${Placas.html(26,'','z-tr')}${Placas.html(32,'','z-cl')}</span>
      <span class="opc"></span><span>${Placas.html(5,'','z-hr tnum')}</span><span>${Placas.html(6,'','z-tm tnum')}</span><span class="conf"></span></section>`).join('');
  }
  for (let n=1; n<=NDOCAS; n++){
    const el = box.querySelector(`.doca[data-d="${n}"]`), lista = porDoca[n], f = el.querySelectorAll('.fl'), sts = el.querySelector('.sts'), d0 = (n-1)*110;
    const marca = (oc) => { const a = oc?'ocup':'livre'; if (sts.dataset.a !== a){ if (sts.dataset.a){ sts.classList.remove('vira'); void sts.offsetWidth; sts.classList.add('vira'); }
        sts.dataset.a = a; sts.style.setProperty('--c', oc?'var(--s-noshow)':'var(--s-concluido)'); el.style.setProperty('--c', oc?'var(--s-noshow)':'var(--s-concluido)');
        sts.innerHTML = oc ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 21V9l8-5 8 5v12"/><path d="M8 21v-7h8v7M8 17h8"/></svg><span>OCUPADA</span>'
                           : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M4 12.5l5 5L20 6.5"/></svg><span>LIVRE</span>'; } };
    el.classList.toggle('ocup', !!lista); el.classList.toggle('livre', !lista);
    if (!lista){
      marca(false);
      Placas.troca(f[1], '', d0); Placas.troca(f[2], 'DISPONÍVEL P/ PRÓXIMO VEÍCULO', d0+80); Placas.troca(f[3], '', d0); Placas.troca(f[4], '', d0);
      el.querySelector('.opc').innerHTML = ''; el.querySelector('.conf').innerHTML = '';
      continue;
    }
    ocup++;
    const i = lista[0], t0 = quando(i.inicio) || quando(i.movido) || quando(i.chegada);
    const cross = /cross/i.test(i.operacao||'');
    marca(true);
    Placas.troca(f[1], bonito(i.transportadora)||'Transportadora', d0); Placas.troca(f[2], bonito(i.cliente), d0+120);
    Placas.troca(f[3], t0 ? hhmm(i.inicio||i.movido||i.chegada) : '', d0+200);
    Placas.troca(f[4], t0 ? dur(Date.now()-t0.getTime()).padStart(6,' ') : '', d0+240);
    el.querySelector('.opc').innerHTML = `<span class="op">${i.funil==='exp'?'EXPEDIÇÃO':'RECEBIMENTO'}</span>${cross?'<span class="tag-xd">CROSSDOCKING</span>':''}`;
    el.querySelector('.conf').innerHTML = [i.conferente?`conf. <b>${esc(primeiro(i.conferente))}</b>`:'', lista.length>1?`+${lista.length-1} na mesma doca`:''].filter(Boolean).join('<br>');
  }
  const aguard = ITENS.filter(i=>i.etapa==='aguardando_doca' && !i.doDiaAnterior).length;
  const apres = ITENS.filter(i=>i.etapa==='apresentou' && !i.doDiaAnterior).length;
  const cross = semDoca.filter(i=>/cross/i.test(i.operacao||'')).length;
  document.getElementById('res').innerHTML = `<span style="color:var(--s-concluido)"><b class="tnum">${NDOCAS-ocup}</b>livres</span><span style="color:var(--s-noshow)"><b class="tnum">${ocup}</b>ocupadas</span>`;
  const partes = [`<b>${apres}</b> se apresentaram`, `<b>${aguard}</b> aguardando doca`];
  if (cross) partes.push(`<b>${cross}</b> em crossdocking (sem doca)`);
  const outros = semDoca.length - cross; if (outros>0) partes.push(`<b>${outros}</b> em operação sem doca informada`);
  document.getElementById('fila').innerHTML = partes.join(' · ');
  document.getElementById('rel').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
carregar(); setInterval(carregar, 20000); setInterval(()=>{ if (ITENS.length) desenhar(); }, 30000);
let LARG = Placas.simples(); addEventListener('resize', ()=>{ if (Placas.simples() !== LARG){ LARG = Placas.simples(); if (ITENS.length) desenhar(); } });
</script>
</body>
</html>
