<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Próximos agendamentos · Controle de Pátio Vix Log</title>
<link rel="icon" href="icone-vixlog.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pátio Vix Log">
<style>
  :root{--bg:#0a1226;--panel:#111b36;--linha:#27396b;--txt:#eef2ff;--mut:#8fa1cc;--az:#5b8cff;--ok:#2ecc8f;--am:#ffb020;--vm:#ff4d5e}
  *{box-sizing:border-box;margin:0}
  html{font-size:16px} @media (min-width:1200px){html{font-size:calc(100vw / 120)}}
  body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding:.8rem 1rem}
  @media (min-width:1200px){body{height:100vh;overflow:hidden}}
  header{display:flex;align-items:center;gap:1.2rem;height:5rem;flex:none}
  header img{height:3.6rem} .sep{width:1px;align-self:stretch;margin:.8rem 0;background:var(--linha)}
  .tit small{display:block;font-size:.95rem;letter-spacing:.2em;color:var(--mut);font-weight:600}
  .tit strong{font-size:2.1rem;letter-spacing:.04em;font-weight:800}
  .dt{margin-left:auto;text-align:right;font-size:1.15rem;color:var(--mut)} .dt b{display:block;font-size:1.7rem;color:var(--am)}
  @media (max-width:700px){html{font-size:12px} .dt{display:none} header{height:auto;padding-bottom:.4rem} header img{height:2.6rem} .tit strong{font-size:1.5rem}}
  main{flex:1;min-height:0;margin-top:.8rem;overflow:hidden;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,34rem),1fr));gap:.9rem;align-content:start}
  @media (max-width:1199px){main{overflow:visible}}
  .dia{background:var(--panel);border:1px solid var(--linha);border-radius:.8rem;overflow:hidden}
  .dia.vz{opacity:.6}
  .dh{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .8rem;padding:.6rem 1.2rem;border-bottom:1px solid var(--linha);background:rgba(255,255,255,.03)}
  .dh b{white-space:nowrap;font-size:1.6rem;font-weight:800;color:var(--am);text-transform:uppercase;letter-spacing:.04em}
  .dh span{white-space:nowrap;font-size:1.15rem;color:var(--mut)}
  .dh em{flex-basis:100%;font-style:normal;font-size:1rem;color:var(--mut)}
  table{width:100%;border-collapse:collapse}
  th{font-size:.75rem;letter-spacing:.1em;color:var(--mut);font-weight:700;text-align:right;padding:.5rem 1.2rem .3rem}
  th:first-child,td:first-child{text-align:left}
  td{font-size:1.25rem;padding:.4rem 1.2rem;border-top:1px solid rgba(39,57,107,.55);text-align:right;font-variant-numeric:tabular-nums}
  td:first-child{font-weight:600} td.n{width:5.5rem} td.p{color:var(--ok);width:6.5rem;font-weight:700} td.v{color:var(--am);width:6.5rem;font-weight:700} td.z{color:var(--mut)}
  .sem{padding:.9rem 1.2rem;color:var(--mut);font-size:1.2rem}
  #erro{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:#111c3c;border:1px solid var(--vm);color:#ffb3bb;padding:.7rem 1rem;border-radius:.7rem;display:none;z-index:5}
</style>
</head>
<body>
<header>
  <img src="logo-vixlog.svg" alt="Vix Log"><div class="sep"></div>
  <div class="tit"><small>CONTROLE DE PÁTIO</small><strong>PRÓXIMOS AGENDAMENTOS</strong></div>
  <div class="dt" id="sub"></div>
</header>
<main id="cols"></main>
<div id="erro"></div>
<script src="config.js"></script>
<script>
/* Próximos agendamentos em lista: lê "proximos" do Worker e mostra os próximos N dias corridos (padrão 7; ?dias=3 muda).
   Dias úteis sem agendamento aparecem como "Sem agendamentos"; sábado e domingo só aparecem se houver. */
const CFG = Object.assign({api:'', intervalo:60}, window.TORRE_CONFIG||{});
const Q = new URLSearchParams(location.search), DEMO = Q.has('demo');
const NDIAS = Math.min(14, Math.max(1, parseInt(Q.get('dias')||CFG.proximosDias||7, 10) || 7));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let TOKEN = Q.get('t') || ''; if (TOKEN) lsSet('torre_t', TOKEN); else TOKEN = lsGet('torre_t') || '';
const $ = s => document.querySelector(s), esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const bonito = s => String(s||'').replace(/\s+/g,' ').trim();
const curto = s => bonito(s).replace(/\b(LTDA|EIRELI|S\.?\/?A\.?|ME|EPP)\b\.?/gi,'').replace(/\s+/g,' ').trim();
const nf = n => n.toLocaleString('pt-BR');
const soma = (d,n) => { const x = new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };

function demo(){
  const C = ['Semina Indústria e Comércio','Delly Distribuidora de Cosméticos','Comercial Hello Brasil','YOFC Brasil Cabos e Soluções','Lebon Produtos Químicos','AEA Distribuidora de Materiais Elétricos','GRF Distribuição'];
  const mk = (data,n,o)=>({data,itens:Array.from({length:n},(_,i)=>{const p=(i+o)%3!==1;return {id:i,cliente:C[(i*3+o)%7],tipo:p?'Paletes':'Volumes',qtd:String(p?4+((i+o)*7)%26:20+((i+o)*37)%400)}})});
  return {hoje:'2026-10-09',proximos:[mk('2026-10-13',9,0),mk('2026-10-14',2,2),mk('2026-10-15',5,5),mk('2026-10-16',4,1)]};
}
async function carregar(){
  try{
    let r; if (DEMO) r = demo(); else {
      const f = await fetch(`${CFG.api.replace(/\/$/,'')}/?t=${encodeURIComponent(TOKEN)}`,{cache:'no-store'});
      if (f.status===401) throw new Error('Token inválido — abra com ?t=SEU_TOKEN'); if (!f.ok) throw new Error('Erro '+f.status);
      r = await f.json(); if (!r.proximos) throw new Error('O Worker ainda não envia os próximos agendamentos (atualize o código e dê Deploy).');
    }
    desenhar(r); $('#erro').style.display='none';
  }catch(e){ $('#erro').textContent='⚠ '+(e.message||e); $('#erro').style.display='block'; }
}
function agrupar(its){
  const cli = {};
  its.forEach(i=>{ const n = curto(i.cliente)||bonito(i.cliente)||'—'; const c = (cli[n] ||= {n:0,p:0,v:0}); c.n++; if(i.tipo==='Paletes') c.p += +i.qtd||0; else if(i.tipo==='Volumes') c.v += +i.qtd||0; });
  return Object.entries(cli).sort((a,b)=>b[1].n-a[1].n || a[0].localeCompare(b[0],'pt-BR'));
}
function desenhar(r){
  const mapa = Object.fromEntries((r.proximos||[]).map(d=>[d.data,d.itens||[]])), html = []; let total = 0;
  for (let k=1;k<=NDIAS;k++){
    const data = soma(r.hoje,k), t = new Date(data+'T12:00:00Z'), dow = t.getUTCDay(), its = mapa[data]||[];
    if (!its.length && (dow===0||dow===6)) continue;
    const lin = agrupar(its), pal = lin.reduce((s,[,c])=>s+c.p,0), vol = lin.reduce((s,[,c])=>s+c.v,0); total += its.length;
    const cab = `<div class="dh"><b>${DIAS[dow]}</b><span>${String(t.getUTCDate()).padStart(2,'0')} de ${MESES[t.getUTCMonth()]}</span>`
      + (its.length ? `<em>${its.length} agendamento${its.length>1?'s':''} · ${nf(pal)} paletes · ${nf(vol)} volumes</em>` : '') + '</div>';
    html.push(its.length
      ? `<section class="dia">${cab}<table><thead><tr><th>CLIENTE</th><th>AGEND.</th><th>PALETES</th><th>VOLUMES</th></tr></thead><tbody>`
        + lin.map(([n,c])=>`<tr><td>${esc(n)}</td><td class="n">${c.n}</td><td class="p ${c.p?'':'z'}">${c.p?nf(c.p):'—'}</td><td class="v ${c.v?'':'z'}">${c.v?nf(c.v):'—'}</td></tr>`).join('')
        + '</tbody></table></section>'
      : `<section class="dia vz">${cab}<div class="sem">Sem agendamentos</div></section>`);
  }
  $('#cols').innerHTML = html.join('');
  $('#sub').innerHTML = `<b>${total} agendamento${total===1?'':'s'}</b>próximos ${NDIAS} dias`;
}
/* rolagem automática quando não cabe */
let dir=1, pausa=3, tAnt=performance.now();
(function rolar(t){ const dt=(t-tAnt)/1000; tAnt=t; const el=$('#cols'), max=el.scrollHeight-el.clientHeight;
  if(max<4||getComputedStyle(el).overflow==='visible'){el.scrollTop=0} else if(pausa>0){pausa-=dt} else { el.scrollTop+=dir*40*dt;
    if(el.scrollTop>=max-1){dir=-1;pausa=3}else if(el.scrollTop<=0){dir=1;pausa=3} }
  requestAnimationFrame(rolar); })(performance.now());
carregar(); setInterval(carregar, (CFG.intervalo||60)*1000);
</script>
</body></html>
