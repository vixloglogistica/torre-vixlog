<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Programação do dia seguinte · Controle de Pátio Vix Log</title>
<link rel="icon" href="icone-vixlog.svg">
<style>
  :root{--bg:#070d1f;--panel:#0f1a38;--linha:#27396b;--txt:#eef2ff;--mut:#8fa1cc;--az:#5b8cff;--ok:#2ecc8f;--am:#ffb020;--vm:#ff4d5e;--rox:#a98bff}
  *{box-sizing:border-box;margin:0}
  html{font-size:16px} @media (min-width:1200px){html{font-size:calc(100vw / 120)}}
  body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding:.8rem 1rem}
  @media (min-width:1200px){body{height:100vh;overflow:hidden}}
  header{display:flex;align-items:center;gap:1.2rem;height:5rem;flex:none}
  header img{height:3.6rem} .sep{width:1px;align-self:stretch;margin:.8rem 0;background:var(--linha)}
  .tit small{display:block;font-size:.95rem;letter-spacing:.2em;color:var(--mut);font-weight:600}
  .tit strong{font-size:2.1rem;letter-spacing:.04em;font-weight:800}
  .dt{margin-left:auto;text-align:right}
  .dt b{display:block;font-size:2.2rem;letter-spacing:.06em;font-weight:800;color:var(--am);text-transform:uppercase}
  .dt span{font-size:1.1rem;color:var(--mut)}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;margin-top:.5rem;flex:none}
  .kpi{background:var(--panel);border:1px solid var(--linha);border-left:.45rem solid var(--c);border-radius:.7rem;padding:.7rem 1.1rem}
  .kpi .r{font-size:.95rem;letter-spacing:.14em;color:var(--mut);font-weight:700}
  .kpi .v{font-size:3.2rem;font-weight:800;line-height:1.05}
  main{flex:1;min-height:0;display:grid;grid-template-columns:2.1fr 1fr;gap:.8rem;margin-top:.8rem}
  @media (max-width:1199px){main{grid-template-columns:1fr}}
  .box{background:var(--panel);border:1px solid var(--linha);border-radius:.8rem;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .box h3{font-size:.95rem;letter-spacing:.18em;color:var(--mut);font-weight:700;padding:.9rem 1.2rem .6rem;flex:none}
  .cab,.lin{display:grid;grid-template-columns:1.1fr 1.5fr 1fr 1.2fr;column-gap:1rem;align-items:center;padding:0 1.2rem}
  .cab{height:2.6rem;border-bottom:2px solid var(--linha);font-size:.95rem;letter-spacing:.16em;color:var(--mut);font-weight:700;background:linear-gradient(rgba(255,255,255,.05),transparent);flex:none}
  .corpo{flex:1;overflow:hidden;min-height:0}
  .lin{min-height:3.7rem;border-bottom:1px solid rgba(39,57,107,.55);padding-top:.35rem;padding-bottom:.35rem}
  .lin .t{font-size:1.35rem;font-weight:800;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
  .lin .c{font-size:1.15rem;color:#c5d2f5;line-height:1.15;overflow-wrap:anywhere}
  .lin .q{font-size:1.25rem;font-weight:800}
  .lin .q i{font-style:normal;font-weight:600;color:var(--mut);font-size:.95rem;margin-left:.3rem}
  .lin .o{font-size:.95rem;color:var(--am);line-height:1.15}
  .cli{padding:0 1.2rem;overflow:hidden;flex:1;min-height:0}
  .cl{padding:.55rem 0;border-bottom:1px solid rgba(39,57,107,.55)}
  .cl .n{display:flex;justify-content:space-between;gap:.8rem;font-size:1.15rem;font-weight:800;text-transform:uppercase}
  .cl .n em{font-style:normal;color:var(--az);font-size:1.6rem;line-height:1}
  .cl .b{height:.5rem;border-radius:.3rem;background:#14275a;margin-top:.35rem;overflow:hidden}
  .cl .b i{display:block;height:100%;background:linear-gradient(90deg,#4a6fe0,#27368f)}
  .cl .s{font-size:.9rem;color:var(--mut);margin-top:.25rem}
  .vazio{margin:auto;color:var(--mut);font-size:1.3rem;letter-spacing:.12em;text-align:center;padding:3rem}
  #erro{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:#111c3c;border:1px solid var(--vm);color:#ffb3bb;padding:.7rem 1rem;border-radius:.7rem;display:none;z-index:5}
</style>
</head>
<body>
<header>
  <img src="logo-vixlog.svg" alt="Vix Log"><div class="sep"></div>
  <div class="tit"><small>CONTROLE DE PÁTIO</small><strong>PROGRAMAÇÃO DO DIA SEGUINTE</strong></div>
  <div class="dt"><b id="dia">—</b><span id="data">—</span></div>
</header>
<section class="kpis" id="kpis"></section>
<main>
  <div class="box"><h3>AGENDAMENTOS PREVISTOS</h3>
    <div class="cab"><span>TRANSPORTADORA</span><span>CLIENTE</span><span>CARGA</span><span>OBSERVAÇÃO</span></div>
    <div class="corpo" id="lista" data-b></div></div>
  <div class="box"><h3>POR CLIENTE</h3><div class="cli" id="clientes" data-b></div></div>
</main>
<div id="erro"></div>
<script src="config.js"></script>
<script>
/* Programação do dia seguinte — lê "amanha" do Worker (próximo dia com agendamentos; sexta mostra segunda, sábado se houver) */
const CFG = Object.assign({api:'', intervalo:60}, window.TORRE_CONFIG||{});
const Q = new URLSearchParams(location.search), DEMO = Q.has('demo');
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let TOKEN = Q.get('t') || ''; if (TOKEN) lsSet('torre_t', TOKEN); else TOKEN = lsGet('torre_t') || '';
const $ = s => document.querySelector(s), esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const bonito = s => String(s||'').replace(/\s+/g,' ').trim();
const curto = s => bonito(s).replace(/\b(LTDA|EIRELI|S\.?\/?A\.?|ME|EPP)\b\.?/gi,'').replace(/\s+/g,' ').trim();
const nf = n => n.toLocaleString('pt-BR');

function demo(){
  const C = ['SEMINA INDUSTRIA E COMERCIO LTDA','DELLY DISTRIBUIDORA DE COSMETICOS LTDA','COMERCIAL HELLO BRASIL LTDA','YOFC BRASIL CABOS E SOLUCOES LTDA','LEBON PRODUTOS QUIMICOS LTDA','AEA DISTRIBUIDORA DE MATERIAIS ELETRICOS LTDA','GRF DISTRIBUICAO LTDA'];
  const T = ['JOMED','Ativa Logística LTDA','Modular Transportes','Transgarra Operações Logísticas LTDA','TEK LOGISTIC','CDL','Patrus Transportes'];
  const it = []; for (let i=0;i<16;i++){ const p = i%3!==1; it.push({id:i,cliente:C[(i*3)%7],transportadora:T[(i*5)%7],tipo:p?'Paletes':'Volumes',qtd:String(p?4+(i*7)%26:20+(i*37)%400),obs:i%5===0?'Descarga com empilhadeira':i%7===0?'Carga frágil':''}); }
  return {data:'2026-10-05', itens:it};
}
async function carregar(){
  try{
    let a; if (DEMO) a = demo(); else {
      const r = await fetch(`${CFG.api.replace(/\/$/,'')}/?t=${encodeURIComponent(TOKEN)}`,{cache:'no-store'});
      if (r.status===401) throw new Error('Token inválido — abra com ?t=SEU_TOKEN'); if (!r.ok) throw new Error('Erro '+r.status);
      a = (await r.json()).amanha; if (!a) throw new Error('O Worker ainda não envia a programação (atualize o código e dê Deploy).');
    }
    desenhar(a); $('#erro').style.display='none';
  }catch(e){ $('#erro').textContent='⚠ '+(e.message||e); $('#erro').style.display='block'; }
}
function desenhar(a){
  const d = new Date(a.data+'T12:00:00Z');
  $('#dia').textContent = DIAS[d.getUTCDay()]; $('#data').textContent = `${String(d.getUTCDate()).padStart(2,'0')} de ${MESES[d.getUTCMonth()]} de ${d.getUTCFullYear()}`;
  const its = a.itens || [];
  const pal = its.filter(i=>i.tipo==='Paletes').reduce((s,i)=>s+(+i.qtd||0),0), vol = its.filter(i=>i.tipo==='Volumes').reduce((s,i)=>s+(+i.qtd||0),0);
  const cli = {}; its.forEach(i=>{ const n = curto(i.cliente)||'—'; (cli[n] ||= {n:0,p:0,v:0}).n++; if(i.tipo==='Paletes') cli[n].p += +i.qtd||0; else cli[n].v += +i.qtd||0; });
  const trs = new Set(its.map(i=>bonito(i.transportadora).toUpperCase()).filter(Boolean));
  $('#kpis').innerHTML = [['AGENDAMENTOS',its.length,'var(--az)'],['PALETES',nf(pal),'var(--ok)'],['VOLUMES',nf(vol),'var(--am)'],['CLIENTES',Object.keys(cli).length,'var(--rox)'],['TRANSPORTADORAS',trs.size,'#ff7a3d']]
    .map(([r,v,c])=>`<div class="kpi" style="--c:${c}"><div class="r">${r}</div><div class="v">${v}</div></div>`).join('');
  const ord = [...its].sort((x,y)=>(curto(x.cliente)||'').localeCompare(curto(y.cliente)||'') || (x.transportadora||'').localeCompare(y.transportadora||''));
  $('#lista').innerHTML = ord.length ? ord.map(i=>`<div class="lin"><span class="t">${esc(bonito(i.transportadora)||'A definir')}</span><span class="c">${esc(curto(i.cliente)||bonito(i.cliente))}</span>
      <span class="q">${i.qtd?esc(i.qtd):'—'}<i>${i.tipo==='Paletes'?'paletes':i.tipo==='Volumes'?'volumes':''}</i></span><span class="o">${esc(i.obs||'')}</span></div>`).join('') : '<div class="vazio">— NENHUM AGENDAMENTO —</div>';
  const mx = Math.max(1,...Object.values(cli).map(c=>c.n));
  $('#clientes').innerHTML = Object.entries(cli).sort((x,y)=>y[1].n-x[1].n).map(([n,c])=>`<div class="cl"><div class="n"><span>${esc(n)}</span><em>${c.n}</em></div><div class="b"><i style="width:${100*c.n/mx}%"></i></div>
      <div class="s">${[c.p?nf(c.p)+' paletes':'',c.v?nf(c.v)+' volumes':''].filter(Boolean).join(' · ')}</div></div>`).join('');
}
/* rolagem automática quando não cabe */
const ROLA = new WeakMap(); let tAnt = performance.now();
(function rolar(t){ const dt=(t-tAnt)/1000; tAnt=t;
  document.querySelectorAll('[data-b]').forEach(el=>{ const max=el.scrollHeight-el.clientHeight; let s=ROLA.get(el); if(!s){s={dir:1,pausa:3};ROLA.set(el,s)}
    if(max<4){el.scrollTop=0;return} if(s.pausa>0){s.pausa-=dt;return} el.scrollTop+=s.dir*40*dt;
    if(el.scrollTop>=max-1){s.dir=-1;s.pausa=3}else if(el.scrollTop<=0){s.dir=1;s.pausa=3} });
  requestAnimationFrame(rolar); })(performance.now());
carregar(); setInterval(carregar, (CFG.intervalo||60)*1000);
</script>
</body></html>
