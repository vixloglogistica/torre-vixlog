<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Programação do dia seguinte · Controle de Pátio Vix Log</title>
<link rel="icon" href="icone-vixlog.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pátio Vix Log">
<link rel="stylesheet" href="tema.css">
<style>
  /* layout da programação do dia seguinte — cores e fontes vêm de tema.css */
  *{box-sizing:border-box;margin:0}
  html{font-size:16px} @media (min-width:1200px){html{font-size:calc(100vw / 120)}}
  body{min-height:100vh;display:flex;flex-direction:column;padding:.8rem 1.1rem}
  @media (min-width:1200px){body{height:100vh;overflow:hidden}}
  header{display:flex;align-items:center;gap:1.2rem;min-height:5.6rem;flex:none;flex-wrap:wrap}
  header img{height:3.7rem;max-width:100%} .sep{width:1px;align-self:stretch;margin:.8rem 0;background:var(--linha)}
  .tit small{display:block;font:700 1rem/1 var(--f-texto);letter-spacing:.26em;color:var(--mut);margin-bottom:.35rem}
  .tit strong{font:800 2.7rem/1 var(--f-titulo);letter-spacing:.04em}
  .dt{margin-left:auto;text-align:right}
  .dt b{display:block;font:800 2.9rem/1 var(--f-titulo);letter-spacing:.05em;color:var(--s-apresentou);text-transform:uppercase}
  .dt span{font:500 1.15rem var(--f-texto);color:var(--mut)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-top:.6rem;flex:none}
  .kpi{background:var(--panel);border:1px solid var(--linha);border-bottom:.3rem solid var(--c);border-radius:.6rem;padding:.6rem 1.1rem;display:flex;flex-direction:column;gap:.4rem;min-width:0}
  .kpi .r{font:700 1rem/1.1 var(--f-texto);letter-spacing:.14em;color:var(--mut);display:flex;align-items:center;gap:.5rem}
  .kpi .r::before{content:"";width:.75rem;height:.75rem;border-radius:50%;background:var(--c);box-shadow:0 0 .5rem var(--c)}
  .z-kp{--w:2.2rem;--h:3.5rem;--fs:2.85rem;--gp:.1rem;--fs-s:2rem}
  main{flex:1;min-height:0;margin-top:.8rem;display:flex}
  .box{background:var(--panel);border:1px solid var(--linha);border-radius:.6rem;display:flex;flex-direction:column;min-height:0;overflow:hidden;flex:1}
  .cab,.lin{display:grid;grid-template-columns:minmax(0,1fr) 9rem 11rem 12rem;column-gap:1.2rem;align-items:center;padding:0 1.6rem}
  .cab{height:3rem;border-bottom:2px solid var(--linha);font:700 1.02rem/1 var(--f-texto);letter-spacing:.2em;color:var(--mut);flex:none}
  .cab span:nth-child(n+2){text-align:right}
  .corpo{flex:1;overflow:hidden;min-height:0;display:flex;flex-direction:column}
  .lin{min-height:4.5rem;flex:none;border-bottom:1px solid color-mix(in srgb,var(--linha) 70%,transparent)}
  .lin:nth-child(even){background:rgba(255,255,255,.022)}
  .lin>span{display:flex;justify-content:flex-end;min-width:0}
  .lin>span:first-child{justify-content:flex-start}
  .z-cl{--w:1.25rem;--h:2.8rem;--fs:2.15rem}
  .z-n{--w:1.25rem;--h:2.8rem;--fs:2.15rem}
  .z-n.p{--cc:var(--s-concluido)} .z-n.v{--cc:var(--s-apresentou)} .z-n.z{--cc:var(--txt)}
  .tot{background:color-mix(in srgb,var(--marca) 14%,transparent);border-top:2px solid var(--marca);border-bottom:0;min-height:5rem;flex:none}
  .tot .rot{font:800 1.5rem/1 var(--f-titulo);letter-spacing:.2em}
  .vazio{margin:auto;color:var(--mut);font:700 1.4rem var(--f-titulo);letter-spacing:.16em;text-align:center;padding:3rem}
  #erro{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);display:none;z-index:5;max-width:92vw}
  @media (max-width:999px){
    .tit strong{font-size:1.6rem} .dt{margin-left:0;text-align:left} .dt b{font-size:1.7rem}
    .kpis{grid-template-columns:1fr 1fr} .cab,.lin{grid-template-columns:minmax(0,1fr) 3rem 4rem 4.5rem;padding:0 .8rem;column-gap:.5rem}
    .cab{font-size:.7rem;letter-spacing:.08em} .lin{min-height:3.2rem;padding-block:.4rem}
    .kpi .r{font-size:.78rem;letter-spacing:.08em} .z-kp{--fs-s:1.7rem}
  }
</style>
</head>
<body>
<header>
  <img src="logo-vixlog.svg" alt="Vix Log"><div class="sep"></div>
  <div class="tit"><small>CONTROLE DE PÁTIO</small><strong>PROGRAMAÇÃO DO DIA SEGUINTE</strong></div>
  <div class="dt"><b id="dia">—</b><span id="data">—</span></div>
</header>
<section class="kpis" id="kpis"></section>
<main>
  <div class="box">
    <div class="cab"><span>CLIENTE</span><span>AGEND.</span><span>PALETES</span><span>VOLUMES</span></div>
    <div class="corpo" id="lista" data-b></div>
    <div class="lin tot" id="total"></div>
  </div>
</main>
<div id="erro" class="aviso-erro"></div>
<script src="config.js"></script>
<script src="placas.js"></script>
<script>
/* Programação do dia seguinte — lê "amanha" do Worker (próximo dia com agendamentos; sexta mostra segunda, sábado se houver) */
const CFG = Object.assign({api:'', intervalo:60}, window.TORRE_CONFIG||{});
const Q = new URLSearchParams(location.search), DEMO = Q.has('demo');
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let TOKEN = Q.get('t') || ''; if (TOKEN) lsSet('torre_t', TOKEN); else TOKEN = lsGet('torre_t') || '';
const $ = s => document.querySelector(s), esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const bonito = s => String(s||'').replace(/\s+/g,' ').trim();
const curto = s => bonito(s).replace(/\b(LTDA|EIRELI|S\.?\/?A\.?|ME|EPP)\b\.?/gi,'').replace(/\s+/g,' ').trim();
const nf = n => n.toLocaleString('pt-BR');

function demo(){
  const C = ['SEMINA INDUSTRIA E COMERCIO LTDA','DELLY DISTRIBUIDORA DE COSMETICOS LTDA','COMERCIAL HELLO BRASIL LTDA','YOFC BRASIL CABOS E SOLUCOES LTDA','LEBON PRODUTOS QUIMICOS LTDA','AEA DISTRIBUIDORA DE MATERIAIS ELETRICOS LTDA','GRF DISTRIBUICAO LTDA'];
  const T = ['JOMED','Ativa Logística LTDA','Modular Transportes','Transgarra Operações Logísticas LTDA','TEK LOGISTIC','CDL','Patrus Transportes'];
  const it = []; for (let i=0;i<16;i++){ const p = i%3!==1; it.push({id:i,cliente:C[(i*3)%7],transportadora:T[(i*5)%7],tipo:p?'Paletes':'Volumes',qtd:String(p?4+(i*7)%26:20+(i*37)%400),obs:i%5===0?'Descarga com empilhadeira':i%7===0?'Carga frágil':''}); }
  return {data:'2026-10-05', itens:it};
}
async function carregar(){
  try{
    let a; if (DEMO) a = demo(); else {
      const r = await fetch(`${CFG.api.replace(/\/$/,'')}/?t=${encodeURIComponent(TOKEN)}`,{cache:'no-store'});
      if (r.status===401) throw new Error('Token inválido — abra com ?t=SEU_TOKEN'); if (!r.ok) throw new Error('Erro '+r.status);
      a = (await r.json()).amanha; if (!a) throw new Error('O Worker ainda não envia a programação (atualize o código e dê Deploy).');
    }
    desenhar(a); $('#erro').style.display='none';
  }catch(e){ $('#erro').textContent='⚠ '+(e.message||e); $('#erro').style.display='block'; }
}
function desenhar(a){
  const d = new Date(a.data+'T12:00:00Z');
  $('#dia').textContent = DIAS[d.getUTCDay()]; $('#data').textContent = `${String(d.getUTCDate()).padStart(2,'0')} de ${MESES[d.getUTCMonth()]} de ${d.getUTCFullYear()}`;
  const its = a.itens || [], cli = {};
  its.forEach(i=>{ const n = curto(i.cliente)||bonito(i.cliente)||'—'; const c = (cli[n] ||= {n:0,p:0,v:0}); c.n++; if(i.tipo==='Paletes') c.p += +i.qtd||0; else if(i.tipo==='Volumes') c.v += +i.qtd||0; });
  const pal = Object.values(cli).reduce((s,c)=>s+c.p,0), vol = Object.values(cli).reduce((s,c)=>s+c.v,0);
  const kp = [['AGENDAMENTOS',its.length,'var(--marca)'],['CLIENTES',Object.keys(cli).length,'var(--s-cross)'],['PALETES',nf(pal),'var(--s-concluido)'],['VOLUMES',nf(vol),'var(--s-apresentou)']];
  const assK = kp.map(([,v])=>String(v).length).join('|');
  if ($('#kpis').dataset.a !== assK){ $('#kpis').dataset.a = assK; $('#kpis').innerHTML = kp.map(([r,v,c])=>`<div class="kpi" style="--c:${c}"><div class="r">${r}</div><div class="v">${Placas.html(String(v).length,'','z-kp tnum')}</div></div>`).join(''); }
  [...$('#kpis').children].forEach((el,j)=>Placas.troca(el.querySelector('.fl'), String(kp[j][1]), 150+j*90));
  const lin = Object.entries(cli).sort((x,y)=>y[1].n-x[1].n || (y[1].p+y[1].v)-(x[1].p+x[1].v));
  // linhas: as placas só viram no que mudou desde a última leitura
  const nomes = lin.map(([n])=>n).join('|');
  if (SIG !== nomes || !$('#lista').children.length){
    SIG = nomes;
    $('#lista').innerHTML = lin.length ? lin.map(([n])=>`<div class="lin" data-n="${esc(n)}"><span>${Placas.html(44,'','z-cl')}</span><span>${Placas.html(2,'','z-n z tnum')}</span><span>${Placas.html(4,'','z-n p tnum')}</span><span>${Placas.html(5,'','z-n v tnum')}</span></div>`).join('') : '<div class="vazio">— NENHUM AGENDAMENTO —</div>';
  }
  const pad = (v,n) => String(v).padStart(n,' ');
  [...$('#lista').querySelectorAll('.lin')].forEach((el,k)=>{ const [n,c] = lin[k], f = el.querySelectorAll('.fl'), d0 = 200 + k*90;
    Placas.troca(f[0], n, d0); Placas.troca(f[1], pad(c.n,2), d0+60);
    Placas.troca(f[2], pad(c.p?c.p:'-',4), d0+90); Placas.troca(f[3], pad(c.v?c.v:'-',5), d0+120);
    [[f[2],c.p],[f[3],c.v]].forEach(([e,v])=> v ? e.style.removeProperty('--cc') : e.style.setProperty('--cc','var(--mut)')); });
  if (!$('#total').children.length) $('#total').innerHTML = `<span><span class="rot">TOTAL</span></span><span>${Placas.html(3,'','z-n z tnum')}</span><span>${Placas.html(4,'','z-n p tnum')}</span><span>${Placas.html(5,'','z-n v tnum')}</span>`;
  const ft = $('#total').querySelectorAll('.fl'); Placas.troca(ft[0], pad(its.length,3), 300); Placas.troca(ft[1], pad(pal,4), 360); Placas.troca(ft[2], pad(vol,5), 420);
}
let SIG = '';
const tiles = (txt, n, cls='') => { const t = String(txt||'').toUpperCase().slice(0,n).padEnd(n,' ');
  return `<span class="fl ${cls}">` + [...t].map((c,k)=>`<i style="--k:${k}">${c===' '?'&nbsp;':esc(c)}</i>`).join('') + '</span>'; };
/* rolagem automática quando não cabe */
const ROLA = new WeakMap(); let tAnt = performance.now();
(function rolar(t){ const dt=(t-tAnt)/1000; tAnt=t;
  document.querySelectorAll('[data-b]').forEach(el=>{ const max=el.scrollHeight-el.clientHeight; let s=ROLA.get(el); if(!s){s={dir:1,pausa:3};ROLA.set(el,s)}
    if(max<4){el.scrollTop=0;return} if(s.pausa>0){s.pausa-=dt;return} el.scrollTop+=s.dir*40*dt;
    if(el.scrollTop>=max-1){s.dir=-1;s.pausa=3}else if(el.scrollTop<=0){s.dir=1;s.pausa=3} });
  requestAnimationFrame(rolar); })(performance.now());
carregar(); setInterval(carregar, (CFG.intervalo||60)*1000);
</script>
</body></html>
