<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Pátio Vix Log</title>
<link rel="icon" type="image/svg+xml" href="icone-vixlog.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pátio Vix Log">
<link rel="stylesheet" href="tema.css">
<style>
  /* layout do painel da TV — cores e fontes vêm de tema.css */
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:calc(100vw / 120)}              /* 16px num monitor 1920 de largura; escala com a TV */
  body{height:100vh;overflow:hidden;display:grid;grid-template-rows:6.2rem 6rem 1fr 2.6rem;gap:.75rem;padding:.8rem 1.1rem .6rem}

  /* ---------- topo ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:1.5rem}
  .marca{display:flex;align-items:center;gap:1.2rem}
  .logo img{height:3.8rem;width:auto;display:block}
  .titulo{display:grid;grid-template-columns:auto auto;justify-content:start;align-items:center;column-gap:.9rem;row-gap:.35rem;line-height:1}
  .titulo small{grid-column:1/-1}
  .titulo small{display:block;font:700 1.02rem/1 var(--f-texto);letter-spacing:.26em;color:var(--mut)}
  .titulo strong{font:800 3.1rem/1 var(--f-titulo);letter-spacing:.04em}
  .modo{justify-self:start;padding:.42rem .85rem;border-radius:99px;font:800 1.2rem/1 var(--f-texto);letter-spacing:.16em}
  .modo.rec{background:var(--marca);color:var(--sobre-cor)}
  .modo.exp{background:var(--s-apresentou);color:var(--sobre-cor)}
  .relogio{display:flex;align-items:center;gap:1.3rem}
  .data{text-align:right;line-height:1.15}
  .data .d1{font:700 1.65rem/1.1 var(--f-titulo);text-transform:uppercase;letter-spacing:.1em}
  .data .d2{font:500 1.12rem var(--f-texto);color:var(--mut)}
  .hora{display:flex;gap:.3rem;align-items:flex-end}
  .hora .sep{font:800 2.8rem/1 var(--f-titulo);color:var(--mut);align-self:center;animation:tm-pisca 1s steps(2) infinite}
  .z-ck{--w:2.5rem;--h:4.2rem;--fs:3.4rem;--gp:.14rem}
  .z-ck2{--w:1.6rem;--h:2.7rem;--fs:2.1rem;--gp:.1rem;--cc:var(--mut)}

  /* ---------- indicadores ---------- */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:.8rem}
  .kpi{position:relative;background:var(--panel);border:1px solid var(--linha);border-bottom:.3rem solid var(--c,var(--marca));border-radius:.6rem;
       padding:.5rem 1rem;display:flex;flex-direction:column;justify-content:center;gap:.35rem;min-width:0}
  .kpi .r{font:700 1rem/1.15 var(--f-texto);letter-spacing:.13em;color:var(--mut);display:flex;align-items:center;gap:.5rem;white-space:nowrap}
  .kpi .r::before{content:"";width:.75rem;height:.75rem;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 .5rem var(--c)}
  .kpi .v{line-height:1}
  .kpi .p{position:absolute;right:1rem;bottom:.8rem;font:800 1.75rem/1 var(--f-titulo);color:var(--c)}
  .kpi .p small{font-size:1rem;color:var(--mut);margin-left:.05rem}
  .z-kp{--w:2rem;--h:3.2rem;--fs:2.6rem;--gp:.1rem}

  /* ---------- quadro (colunas por etapa · tecla V) ---------- */
  main{display:grid;gap:.8rem;min-height:0}
  .col{background:var(--panel);border:1px solid var(--linha);border-top:.45rem solid var(--c);border-radius:.7rem;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .col-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.65rem 1rem;background:linear-gradient(color-mix(in srgb,var(--c) 16%,transparent),transparent)}
  .col-h h2{font:800 1.5rem/1.05 var(--f-titulo);letter-spacing:.06em;color:var(--c)}
  .col-h .n{font:800 2.3rem/1 var(--f-titulo);min-width:3.2rem;text-align:center;background:color-mix(in srgb,var(--c) 22%,transparent);border-radius:.45rem;padding:.1rem .6rem}
  .col-b{flex:1;overflow:hidden;padding:.6rem;display:flex;flex-direction:column;gap:.55rem;min-height:0}
  .vazio{margin:auto;color:var(--mut);font:700 1.3rem var(--f-titulo);letter-spacing:.16em;opacity:.75;text-align:center}

  .card{background:var(--card);border-left:.45rem solid var(--c);border-radius:.55rem;padding:.6rem .8rem;flex:none}
  .card .t{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
  .card .tr{font:700 1.85rem/1.05 var(--f-titulo);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-transform:uppercase;overflow-wrap:break-word}
  .card .tp{font:800 1.95rem/1 var(--f-titulo);white-space:nowrap}
  .card .cl{font:600 1.18rem/1.2 var(--f-texto);color:var(--mut);margin-top:.2rem;overflow-wrap:break-word}
  .card .mt{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem;align-items:center;font:600 1.02rem var(--f-texto);color:var(--mut)}
  .chip{background:var(--panel);border-radius:.35rem;padding:.25rem .5rem;color:var(--txt);font-weight:700;letter-spacing:.03em}
  .chip.doca{background:var(--txt);color:var(--bg);font:800 1.2rem/1 var(--f-titulo);letter-spacing:.06em}
  .chip.cross{background:transparent;border:2px solid var(--s-cross);color:var(--s-cross)}
  .placa{font-family:var(--f-mono);font-weight:700;color:var(--txt);letter-spacing:.06em;border:1px solid var(--linha);border-radius:.3rem;padding:.1rem .4rem}
  .card.ok .tp{color:var(--s-concluido)} .card.atencao .tp{color:var(--s-apresentou)}
  .card.critico{outline:3px solid var(--s-noshow);outline-offset:-3px} .card.critico .tp{color:var(--s-noshow);animation:tm-pisca 1s steps(2) infinite}
  .card.ontem::after{content:"DIA ANTERIOR";display:inline-block;margin-top:.4rem;font:800 .9rem/1 var(--f-texto);letter-spacing:.08em;color:var(--sobre-cor);background:var(--s-noshow);padding:.25rem .4rem;border-radius:.25rem}
  .card.novo{animation:entra 1.2s ease-out}
  @keyframes entra{0%{box-shadow:0 0 0 .35rem var(--c);transform:scale(1.03)}100%{box-shadow:none;transform:none}}
  .concl .card{padding:.4rem .7rem}
  .concl .tr{font-size:1.4rem} .concl .tp{font-size:1.5rem;color:var(--s-concluido)}
  .concl .cl{font-size:1.02rem}

  /* ---------- painel de aeroporto (visual padrão da TV) ---------- */
  .bd{background:var(--panel);border:1px solid var(--linha);border-radius:.6rem;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .bd-h,.row{display:grid;grid-template-columns:15.5rem 34.4rem 30.8rem 8.1rem 3.3rem 5.8rem 8.4rem;align-items:center;column-gap:1.3rem;padding:0 1.3rem}
  .bd-h{height:3rem;flex:none;border-bottom:2px solid var(--linha);font:700 1.02rem/1 var(--f-texto);letter-spacing:.2em;color:var(--mut)}
  .bd-b{flex:1;overflow:hidden;min-height:0;position:relative}
  .trilho{position:relative}
  .row{position:absolute;left:0;right:0;top:0;height:4.05rem;border-bottom:1px solid color-mix(in srgb,var(--linha) 70%,transparent);transition:transform .9s cubic-bezier(.6,.05,.25,1)}
  .bd-b.ini .row{transition:none}
  .row.par{background:rgba(255,255,255,.022)}
  .row.entra{animation:abre .7s ease-out}
  @keyframes abre{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
  .row .cel{display:flex;align-items:center;gap:.5rem;min-width:0}
  .z-tr{--w:1.22rem;--h:2.7rem;--fs:2.1rem}
  .z-cl{--w:.86rem;--h:2.1rem;--fs:1.55rem;--cc:var(--txt2)}
  .z-pl{--w:1.05rem;--h:2.3rem;--fs:1.65rem}
  .z-dk{--w:1.5rem;--h:2.7rem;--fs:2.1rem;--cc:var(--marca)}
  .z-hr{--w:1.05rem;--h:2.3rem;--fs:1.65rem}
  .z-tm{--w:1.1rem;--h:2.5rem;--fs:1.85rem;--cc:var(--s-concluido)}
  .row.atencao .tmp .fl{--cc:var(--s-apresentou)}
  .row.critico{background:linear-gradient(90deg,color-mix(in srgb,var(--s-noshow) 22%,transparent),transparent 55%)}
  .row.critico .tmp .fl{--cc:var(--s-noshow);animation:tm-pisca 1s steps(2) infinite}
  .row.fim .fl{--cc:var(--mut)}
  .row.fim .tmp .fl{--cc:var(--s-concluido)}
  .row.cross .z-dk{--cc:var(--s-cross)}
  .mais{height:3rem;display:grid;place-items:center;color:var(--mut);letter-spacing:.14em;font-size:1.05rem;flex:none}

  /* ---------- rodapé ---------- */
  footer{display:flex;justify-content:space-between;align-items:center;font:500 1.12rem var(--f-texto);color:var(--mut);gap:1rem;white-space:nowrap}
  footer b{color:var(--txt)} footer .meio{overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center}
  .st{display:inline-flex;align-items:center;gap:.55rem;padding:.2rem .7rem .2rem .2rem;border-radius:99px}
  .led{width:.85rem;height:.85rem;border-radius:50%;background:var(--s-concluido);box-shadow:0 0 .6rem var(--s-concluido)}
  .led.off{background:var(--s-noshow);box-shadow:0 0 .6rem var(--s-noshow);animation:tm-pisca 1s steps(2) infinite}
  .st:has(.led.off){background:var(--s-noshow);color:#fff;font-weight:800;letter-spacing:.04em;padding-left:.5rem}
  .st:has(.led.off) .led{background:#fff;box-shadow:none}
  .led.demo{background:var(--demo);box-shadow:0 0 .6rem var(--demo)}
  #som{cursor:pointer;padding:.15rem .9rem;border-radius:99px;border:1px solid var(--linha);background:var(--panel);color:var(--txt);font:inherit}
  #som.mudo{border-color:var(--s-noshow);color:var(--s-noshow);font-weight:800;animation:tm-pisca 1.4s steps(2) infinite}

  /* ---------- telas de rotação (KPIs / dia seguinte) e chamada ---------- */
  #kpi{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:30;background:var(--bg);transform-origin:50% 0;animation:tm-entra .6s ease-out}
  #chamada{position:fixed;inset:0;display:none;place-items:center;z-index:50;background:rgba(2,6,16,.9);backdrop-filter:blur(6px)}
  #chamada.on{display:grid}
  .ch{width:92vw;text-align:center;border-radius:1.6rem;padding:3rem 2.5rem 2.6rem;background:var(--panel);
      border:.35rem solid var(--c);box-shadow:0 0 6rem color-mix(in srgb,var(--c) 55%,transparent);animation:pulso 1.4s ease-in-out infinite;
      display:flex;flex-direction:column;align-items:center;gap:1.3rem}
  @keyframes pulso{50%{box-shadow:0 0 1.5rem color-mix(in srgb,var(--c) 40%,transparent)}}
  .ch .e{font:800 2.5rem/1 var(--f-titulo);letter-spacing:.3em;color:var(--c)}
  .ch .tr{display:flex;justify-content:center}
  .ch .cl{display:flex;justify-content:center}
  .z-chT{--w:3.35rem;--h:6rem;--fs:4.9rem;--gp:.16rem}
  .z-chC{--w:2rem;--h:3.4rem;--fs:2.7rem;--gp:.12rem;--cc:var(--txt2)}
  .ch .ib{display:flex;justify-content:center;gap:1.2rem;flex-wrap:wrap}
  .ch .ib span{font:800 2.6rem/1 var(--f-titulo);background:color-mix(in srgb,var(--txt) 12%,transparent);padding:.45rem 1.2rem;border-radius:.7rem}
  .ch .ib .doca{background:var(--c);color:var(--sobre-cor)}
  .ch .ib .cross{background:transparent;border:3px solid var(--s-cross);color:var(--s-cross)}
  .ch .fila{font:600 1.5rem var(--f-texto);color:var(--mut);letter-spacing:.1em}

  #erro{position:fixed;left:50%;transform:translateX(-50%);bottom:3.6rem;display:none;z-index:40}
  body:has(#led.off) .carregando{font-size:0;animation:none}
  body:has(#led.off) .carregando::after{content:"— SEM DADOS: VEJA O AVISO ABAIXO —";font-size:1.3rem}
  @media (prefers-reduced-motion: reduce){.row{transition:none}.row.entra,#kpi,.ch{animation:none}}
</style>
</head>
<body>

<header>
  <div class="marca">
    <div class="logo"><img src="logo-vixlog.svg" alt="Vix Log - Operador Logístico"></div>
    <div class="titulo"><small>CONTROLE DE PÁTIO</small><strong id="tit">RECEBIMENTO</strong><span id="modo" class="modo rec">MANHÃ</span></div>
  </div>
  <div class="relogio">
    <div class="data"><div class="d1" id="d1"></div><div class="d2" id="d2"></div></div>
    <div class="hora tnum" id="hora"></div>
  </div>
</header>

<section class="kpis" id="kpis"></section>
<main id="quadro"></main>

<footer>
  <span class="st"><span class="led" id="led"></span><span id="estado">conectando…</span></span>
  <span class="meio" id="meio"></span>
  <button id="som" class="mudo" title="Clique para ativar/testar o som">🔇 SOM DESLIGADO — clique</button>
</footer>

<iframe id="kpi" title="Painel Logístico KPIs" style="display:none"></iframe>
<div id="chamada"></div>
<div id="erro" class="aviso-erro"></div>

<script src="config.js"></script>
<script src="placas.js"></script>
<script>
/* =====================================================================
   CONFIGURAÇÃO — o endereço do proxy fica em config.js; o token vai na URL (?t=...)
   e é lembrado neste navegador. Outros parâmetros úteis na URL:
     ?demo            dados de demonstração (sem Bitrix24)
     ?modo=rec|exp    força o quadro (padrão: automático por horário)
     ?virada=12       hora em que o quadro passa de Recebimento para Expedição
     ?mudo            não toca som
   Teclas: R = recebimento · E = expedição · A = automático · T = testar chamada · K = painel de KPIs · P = programação de amanhã · V = visual
   ===================================================================== */
const CFG = Object.assign({
  api: '',                 // URL do proxy (Cloudflare Worker)
  intervalo: 20,           // segundos entre atualizações
  viradaHora: 12,          // antes disso: recebimento; depois: expedição
  atencaoMin: 30,          // veículo esperando há mais de X min → amarelo
  criticoMin: 60,          // há mais de X min → vermelho piscando
  visual: 'quadro',        // 'quadro' (colunas) ou 'painel' (lista estilo aeroporto). Tecla V alterna
  noShowHora: 12,          // Recebimento: agendado que não se apresentou até essa hora vira NO-SHOW (0 = desliga)
  kpiCadaSeg: 120,         // a cada quantos segundos o painel de KPIs entra na tela (0 = nunca)
  amanhaHora: 16,          // a partir dessa hora, a tela "Programação do dia seguinte" entra na rotação (0 desliga)
  amanhaSeg: 24,           // quanto tempo ela fica
  kpiSeg: 24,              // quanto tempo ele fica (divide entre Visão Geral / Recebimento / Expedição)
  chamarRec: ['apresentou','aguardando_doca','em_andamento'],  // Recebimento: etapas que disparam som+tela cheia
  chamarExp: ['aguardando_doca','em_andamento'],               // Expedição: 'se apresentou' só aparece no painel, sem aviso/som
  chamadaSeg: 12,          // quanto tempo a chamada fica na tela
  maxAtrasoChamadaMin: 30, // não chama de novo algo que mudou há mais que isso (ex.: TV reiniciada)
  falar: true,             // voz "Transportadora X, cliente Y, se apresentou"
  vozClienteNomes: 2,      // quantos nomes do cliente a voz fala ("Comercial Hello"); 0 = nome completo
}, window.TORRE_CONFIG || {});

const Q = new URLSearchParams(location.search);
const DEMO = Q.has('demo');
if (Q.get('api')) CFG.api = Q.get('api');
if (Q.get('virada')) CFG.viradaHora = +Q.get('virada');
if (Q.get('kpicada')) CFG.kpiCadaSeg = +Q.get('kpicada');   // teste: segundos entre as entradas do KPI
let TOKEN = Q.get('t') || ''; const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
if (TOKEN) lsSet('torre_t', TOKEN); else TOKEN = lsGet('torre_t') || '';

/* ---------- etapas e quadros ---------- */
const ETAPA = {
  agendado:        {nome:'AGENDADO',            cor:'var(--s-agendado)'},
  apresentou:      {nome:'VEÍCULO SE APRESENTOU', cor:'var(--s-apresentou)'},
  aguardando_doca: {nome:'AGUARDANDO DOCA',     cor:'var(--s-doca)'},
  em_andamento:    {nome:'EM RECEBIMENTO',      cor:'var(--s-operacao)'},
  concluido:       {nome:'RECEBIMENTO CONCLUÍDO', cor:'var(--s-concluido)'},
  nao_compareceu:  {nome:'NO-SHOW',            cor:'var(--s-noshow)'},
};
const QUADROS = {
  rec: { titulo:'RECEBIMENTO', rotulo:'MANHÃ', verbo:'recebimento',
         colunas:['agendado','apresentou','aguardando_doca','em_andamento','concluido','nao_compareceu'], grid:'1fr 1fr 1fr 1fr .85fr .8fr',
         nomes:{em_andamento:'EM RECEBIMENTO',concluido:'CONCLUÍDOS',nao_compareceu:'NO-SHOW'} },
  exp: { titulo:'EXPEDIÇÃO', rotulo:'TARDE', verbo:'expedição',
         colunas:['apresentou','aguardando_doca','em_andamento','concluido'], grid:'1fr 1fr 1fr .9fr',
         nomes:{em_andamento:'EM EXPEDIÇÃO',concluido:'CONCLUÍDAS'} },
};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const SP = 'America/Sao_Paulo';
const parte = (d, o) => new Intl.DateTimeFormat('pt-BR', {timeZone:SP, ...o}).format(d);
const quando = s => s ? new Date(String(s).replace(' ','T') + '-03:00') : null;   // horários do Bitrix24 = Brasília
const hhmm = s => { const d = quando(s); return d ? parte(d,{hour:'2-digit',minute:'2-digit',hour12:false}) : ''; };
const dur = ms => { const m = Math.max(0, Math.floor(ms/60000)); return m >= 60 ? `${Math.floor(m/60)}h${pad(m%60)}` : `${m} min`; };
const mmss = ms => { const t = Math.max(0, Math.floor(ms/1000)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; };
const agoraSP = () => new Date();
const horaSP = () => +parte(agoraSP(),{hour:'2-digit',hour12:false}) % 24;
const curto = s => String(s||'').replace(/\b(LTDA|EIRELI|S\.?\/?A\.?|ME|EPP)\b\.?/gi,'').replace(/\s+/g,' ').trim().split(' ').slice(0,5).join(' ');
const primeiroNome = s => String(s||'').trim().split(/\s+/)[0] || '';
const bonito = s => String(s||'').replace(/\s+/g,' ').trim();

/* ---------- estado ---------- */
let ESTILO = (Q.get('visual') || CFG.visual || 'quadro'), PREV = new Map();
let DADOS = {itens:[], futuros:{}, hoje:''}, MODO_FORCADO = Q.get('modo') || '', ULTIMO_OK = null, FALHA_DESDE = null;
const MODO = () => (MODO_FORCADO==='rec'||MODO_FORCADO==='exp') ? MODO_FORCADO : (horaSP() < CFG.viradaHora ? 'rec' : 'exp');
let MODO_ATUAL = '';

/* ---------- relógio ---------- */
function relogio(){
  const d = agoraSP();
  const h = parte(d,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).split(':');
  const hr = $('#hora');
  if (!hr.querySelector('.fl')) hr.innerHTML = Placas.html(2,h[0],'z-ck tnum') + '<span class="sep">:</span>' + Placas.html(2,h[1],'z-ck tnum') + Placas.html(2,h[2],'z-ck2 tnum');
  const hf = hr.querySelectorAll('.fl'); Placas.troca(hf[0], h[0]); Placas.troca(hf[1], h[1]); Placas.troca(hf[2], h[2], 0, true);
  $('#d1').textContent = parte(d,{weekday:'long'});
  $('#d2').textContent = parte(d,{day:'2-digit',month:'long',year:'numeric'});
  document.querySelectorAll('[data-desde]').forEach(el=>{
    const ms = Date.now() - (+el.dataset.desde);
    if (el.classList.contains('tmp')){ const fl = el.querySelector('.fl'); if (fl) Placas.troca(fl, mmss(ms).padStart(7,' '), 0, true); else el.innerHTML = Placas.html(7, mmss(ms).padStart(7,' '), 'z-tm tnum'); }
    else el.textContent = mmss(ms);
    const card = el.closest('.card,.row'); if (!card) return;
    const min = ms/60000;
    card.classList.toggle('critico', min >= CFG.criticoMin);
    card.classList.toggle('atencao', min >= CFG.atencaoMin && min < CFG.criticoMin);
    card.classList.toggle('ok', min < CFG.atencaoMin);
  });
  const modo = MODO(); if (modo !== MODO_ATUAL) montar(modo);
}

/* ---------- montagem do quadro ---------- */
function montar(modo){
  MODO_ATUAL = modo; const q = QUADROS[modo];
  $('#tit').textContent = q.titulo; const m = $('#modo'); m.textContent = q.rotulo; m.className = 'modo ' + modo;
  document.title = 'Controle de Pátio · ' + q.titulo;
  const quadro = $('#quadro');
  if (ESTILO === 'painel'){
    quadro.style.gridTemplateColumns = '1fr'; PREV.clear();
    quadro.innerHTML = `<div class="bd"><div class="bd-h"><span>SITUAÇÃO</span><span>TRANSPORTADORA</span><span>CLIENTE</span><span>PLACA</span><span>DOCA</span><span>CHEGADA</span><span>TEMPO</span></div><div class="bd-b" data-b><div class="trilho"></div></div></div>`;
    desenhar(); return;
  }
  quadro.style.gridTemplateColumns = q.grid;
  quadro.innerHTML = q.colunas.map(k=>{
    const e = ETAPA[k];

      <div class="col-b" data-b></div></section>`;
  }).join('');
  desenhar();
}

function filtrar(modo){
  const passou = CFG.noShowHora > 0 && horaSP() >= CFG.noShowHora;
  // "Não realizado" e "Incorreto" = agendamento incorreto: não entram no painel nem nas contas
  return DADOS.itens.filter(i=>i.funil===modo && i.etapa!=='nao_realizado' && i.etapa!=='incorreto').map(i=>{
    // Recebimento: ainda "agendado" depois do horário-limite (ou de um dia anterior) = não compareceu
    if (modo==='rec' && i.etapa==='agendado' && (i.doDiaAnterior || passou)) return Object.assign({}, i, {etapa:'nao_compareceu'});
    if (i.etapa==='nao_cumprido') return Object.assign({}, i, {etapa:'nao_compareceu'});
    return i;
  });
}

function cartao(i, k){
  const cor = ETAPA[k].cor;
  const transp = bonito(i.transportadora).toUpperCase() || 'TRANSPORTADORA A DEFINIR';
  const cli = curto(i.cliente) || bonito(i.cliente);
  const qt = i.qtd ? `${esc(i.qtd)} ${i.tipo==='Paletes'?'palete'+(+i.qtd===1?'':'s'):(+i.qtd===1?'volume':'volumes')}` : '';
  let topo = '', extra = '';
  if (k==='apresentou' || k==='aguardando_doca'){
    const t0 = quando(i.chegada) || quando(i.movido);
    topo = `<span class="tp tnum" data-desde="${t0?t0.getTime():Date.now()}">--:--</span>`;
    extra = (i.chegada?`<span>chegou ${hhmm(i.chegada)}</span>`:'');
  } else if (k==='em_andamento'){
    const t0 = quando(i.inicio) || quando(i.movido) || quando(i.chegada);
    topo = `<span class="tp tnum" data-desde="${t0?t0.getTime():Date.now()}">--:--</span>`;
    extra = (i.conferente?`<span>conf. ${esc(primeiroNome(i.conferente))}</span>`:'');
  } else if (k==='concluido'){
    const a = quando(i.chegada), b = quando(i.fim) || quando(i.movido);
    topo = `<span class="tp tnum">${a&&b?dur(b-a):hhmm(i.fim||i.movido)}</span>`;
    extra = `<span>${a?hhmm(i.chegada)+' → ':''}${hhmm(i.fim||i.movido)}</span>`;
  } else {
    extra = i.obs ? `<span>${esc(i.obs.slice(0,34))}</span>` : '';
  }
  const doca = i.doca ? `<span class="chip doca">DOCA ${esc(i.doca)}</span>` : '';
  const cross = /cross/i.test(i.operacao||'') ? `<span class="chip cross">CROSSDOCKING</span>` : '';
  const placa = i.placa ? `<span class="placa">${esc(i.placa)}</span>` : '';
  return `<div class="card ${i.doDiaAnterior?'ontem':''}" style="--c:${cor}" data-id="${i.id}-${k}">
      <div class="t"><span class="tr">${esc(transp)}</span>${topo}</div>
      <div class="cl">${esc(cli)}</div>
      <div class="mt">${cross}${doca}${placa}${qt?`<span>${qt}</span>`:''}${extra}</div></div>`;
}

const CONHECIDOS = new Set();
function desenhar(){
  const modo = MODO_ATUAL, q = QUADROS[modo], itens = filtrar(modo);
  if (ESTILO === 'painel'){ painel(modo, itens); kpis(modo, itens); rodape(modo); relogio(); return; }

    else if (k==='agendado') lista = lista.sort((a,b)=> (a.transportadora||'').localeCompare(b.transportadora||''));

function kpis(modo, itens){

/* ---------- rolagem automática quando há mais cartões do que cabe ---------- */
const ROLA = new WeakMap(); let tAnt = performance.now();
function rolar(t){
  const dt = (t - tAnt)/1000; tAnt = t;
  document.querySelectorAll('[data-b]').forEach(el=>{
    const max = el.scrollHeight - el.clientHeight;
    let s = ROLA.get(el); if(!s){ s = {dir:1, pausa:3}; ROLA.set(el,s); }
    if (max < 4){ el.scrollTop = 0; return; }
    if (s.pausa > 0){ s.pausa -= dt; return; }
    el.scrollTop += s.dir * (el.classList.contains('bd-b') ? 45 : 28) * dt;
    if (el.scrollTop >= max-1){ s.dir=-1; s.pausa=3; } else if (el.scrollTop <= 0){ s.dir=1; s.pausa=3; }
  });
  requestAnimationFrame(rolar);
}

let AC = null, SOM_OK = false, VOZ = null, TESTE_N = 0;
function vozes(){

  const want = (Q.get('voz') || CFG.voz || '').toLowerCase();
  const nota = x => (want && x.name.toLowerCase().includes(want) ? 1000 : 0) + (/natural/i.test(x.name)?100:0) + (/online/i.test(x.name)?50:0) + (/google/i.test(x.name)?30:0)
                  + (/pt-BR/i.test(x.lang)?20:0) + (/francisca|antonio|thalita|luciana|fernanda|vitoria/i.test(x.name)?10:0);
  const v = speechSynthesis.getVoices().filter(x=>/^pt/i.test(x.lang)).sort((a,b)=>nota(b)-nota(a));
  VOZ = v[0] || null; window.VOZES_PT = v.map(x=>x.name);
}
if ('speechSynthesis' in window){ vozes(); speechSynthesis.onvoiceschanged = vozes; }

function ativarSom(){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(e){}
  SOM_OK = !!AC && AC.state === 'running';

function atualizaBotaoSom(){

function nota(freq, ini, dur, vol=.5){
  const o = AC.createOscillator(), g = AC.createGain(); o.type='sine'; o.frequency.value=freq;
  o.connect(g); g.connect(AC.destination);
  const t = AC.currentTime + ini; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t); o.stop(t+dur+.05);
}
function campainha(){            // "ding-dong" duplo, estilo chamada de senha
  if (!AC || Q.has('mudo')) return;
  for (let r=0;r<2;r++){ nota(880, r*1.1, .8); nota(659.25, r*1.1+.45, 1.0); }
}
let FALA_ERR = '', DIAG_T = 0;
function diag(extra, forcar){
  if (!forcar && !FALA_ERR) return;
  const d = document.getElementById('diag'); if (!d) return;
  const n = ('speechSynthesis' in window) ? speechSynthesis.getVoices().length : -1;
  const pt = ('speechSynthesis' in window) ? speechSynthesis.getVoices().filter(x=>/^pt/i.test(x.lang)).map(x=>x.name+(x.localService?'(local)':'(online)')).join(', ') : '';
  d.textContent = `VOZ · total:${n} · pt: ${pt||'NENHUMA'} · escolhida: ${VOZ?VOZ.name:'padrão'} · erro: ${FALA_ERR||'—'} ${extra||''}`;
  d.style.display = 'block'; clearTimeout(DIAG_T); DIAG_T = setTimeout(()=>{ d.style.display='none'; }, 20000);
}
function falar(txt, tentativa=0){
  if (!CFG.falar || Q.has('mudo') || !('speechSynthesis' in window)) return;
  try{
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    if (speechSynthesis.paused) speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(txt); u.lang='pt-BR'; u.rate=.92; u.volume=1;
    const lista = speechSynthesis.getVoices().filter(x=>/^pt/i.test(x.lang));
    // 1ª tentativa: melhor voz; 2ª: voz local (offline), que não depende de internet; 3ª: padrão do sistema
    let v = tentativa===0 ? VOZ : tentativa===1 ? (lista.find(x=>x.localService) || null) : null;
    if (v) u.voice = v;
    window.__u = u;                                   // mantém referência (o Chrome/Edge descartam a fala se o objeto for coletado)
    u.onerror = e => { FALA_ERR = e.error || 'erro'; diag('· tentativa '+(tentativa+1)); console.warn('voz:', FALA_ERR); if (tentativa < 2 && FALA_ERR !== 'canceled' && FALA_ERR !== 'interrupted') setTimeout(()=>falar(txt, tentativa+1), 300); };
    u.onstart = () => { FALA_ERR = ''; diag('· falando ✓'); };
    speechSynthesis.speak(u); diag('· tentativa '+(tentativa+1));
    // se em 2,5 s não começou nem deu erro (voz online travada), tenta a próxima
    setTimeout(()=>{ if (window.__u === u && !speechSynthesis.speaking && tentativa < 2 && !u.__ok) falar(txt, tentativa+1); }, 2500);
    u.addEventListener('start', ()=>{ u.__ok = true; });
  }catch(e){}
}

/* frases curtas: primeiro nome da transportadora e 2 primeiros nomes do cliente (equipe interna):
   chegou  → "Jomed chegou, para a Semina Industria."
   em andamento → "Jomed, doca 3, descarregando a Semina Industria." (Expedição: carregando) */
const primeiroNome2 = s => {

  if (!w.length) return '';

/* cliente: os 2 primeiros nomes ("Comercial Hello"); "de", "da", "e"... não contam como nome.

const nomeCliente = s => {
  const lim = CFG.vozClienteNomes, con = /^(de|da|do|das|dos|e|em)$/i;
  const w = String(s||'').replace(/\b(LTDA|EIRELI|S\.?\/?A\.?|ME|EPP)\b\.?/gi,'').replace(/[.,]/g,' ').replace(/&/g,' e ').split(/\s+/).filter(Boolean);
  const out = []; let n = 0;
  for (const x of w){ if (lim && n >= lim) break; out.push(x); if (!con.test(x) && x.length > 2) n++; }   // iniciais ("J A") não contam
  while (out.length && con.test(out[out.length-1])) out.pop();
  return out.map(x => con.test(x) ? x.toLowerCase() : x.charAt(0).toUpperCase()+x.slice(1).toLowerCase()).join(' ');
};
function fraseChamada(i){
  const t = primeiroNome2(i.transportadora) || 'Transportadora', c = nomeCliente(curto(i.cliente) || i.cliente);
  const d = parseInt(i.doca, 10), doca = isNaN(d) ? '' : `doca ${d}`;
  const exp = i.funil === 'exp', cross = /cross/i.test(i.operacao || '');
  const para = c ? `, para a ${c}` : '';
  /* crossdocking (troca de nota): não fala a doca */
  if (i.etapa === 'em_andamento'){
    if (cross) return `${t}, em crossdocking${para}.`;
    const v = exp ? 'carregando' : 'descarregando';
    return [t, doca, c ? `${v} a ${c}` : v].filter(Boolean).join(', ') + '.';
  }
  if (i.etapa === 'aguardando_doca'){
    if (cross) return `${t}, crossdocking, aguardando liberação${para}.`;
    return exp ? `${t}, aguardando doca, para carregar${c ? ' a ' + c : ''}.` : `${t}, aguardando doca${para}.`;
  }
  return cross ? `${t} chegou, crossdocking${para}.` : `${t} chegou${para}.`;
}
function chamar(item){ FILA.push(item); if(!EM_TELA) proxima(); }


/* ---- rotação: o painel de KPIs entra de tempos em tempos (a chamada sempre fica por cima) ---- */
let KPI_ON = false, KPI_MANUAL = false, KPI_PROX = Date.now() + (CFG.kpiCadaSeg||0)*1000, KPI_T = [];
const noPatio = () => DADOS.itens.some(i=>!i.doDiaAnterior && (i.etapa==='apresentou'||i.etapa==='aguardando_doca'));
let ROT_N = 0;
const amanhaOk = () => CFG.amanhaHora > 0 && horaSP() >= CFG.amanhaHora && DADOS.amanha && DADOS.amanha.itens && DADOS.amanha.itens.length;
function kpiAbrir(manual, qual){
  if (KPI_ON) return; KPI_ON = true; KPI_MANUAL = !!manual;
  const f = $('#kpi'); qual = qual || 'kpi';
  f.src = (qual==='amanha' ? 'amanha.html' : 'kpi.html') + '?embed'; f.style.display = 'block';
  const seg = (qual==='amanha' ? CFG.amanhaSeg : CFG.kpiSeg) || 24, t = seg*1000/3;
  if (qual==='kpi') ['geral','rec','exp'].forEach((a,n)=>KPI_T.push(setTimeout(()=>{ try{ f.contentWindow.postMessage({aba:a},'*'); }catch(e){} }, 1500 + n*t)));
  if (!manual) KPI_T.push(setTimeout(kpiFechar, seg*1000));
}
function kpiFechar(){
  KPI_T.forEach(clearTimeout); KPI_T = []; KPI_ON = false; KPI_MANUAL = false;
  const f = $('#kpi'); f.style.display = 'none'; f.removeAttribute('src');
  KPI_PROX = Date.now() + (CFG.kpiCadaSeg||0)*1000;
}
function kpiTick(){
  if (DEMO || !CFG.api || Q.get('kpi')==='0' || !(CFG.kpiCadaSeg>0) || !ULTIMO_OK) return;
  if (KPI_ON){ if (!KPI_MANUAL && (noPatio() || EM_TELA)) kpiFechar(); return; }
  if (Date.now() < KPI_PROX) return;
  if (noPatio() || EM_TELA || FILA.length){ KPI_PROX = Date.now() + 15000; return; }   // movimento no pátio: adia
  // depois das 16h, alterna: KPI → programação de amanhã → KPI …
  kpiAbrir(false, (amanhaOk() && ROT_N++ % 2 === 1) ? 'amanha' : 'kpi');
}
setInterval(kpiTick, 1000);

/* ---- chamada manual: a equipe aperta CHAMAR na página chamar.html e a TV toca de novo ---- */
let SEQ_MANUAL = +(lsGet('torre_seq')||0), BASE_OK = false;
async function ouvirManual(){
  if (DEMO || !CFG.api) return;
  try{
    const r = await fetch(`${CFG.api.replace(/\/$/,'')}/chamada?t=${encodeURIComponent(TOKEN)}`, {cache:'no-store'});
    if (!r.ok) return; const c = await r.json();
    const primeira = !BASE_OK; BASE_OK = true;
    if (!c.seq || c.seq === SEQ_MANUAL) return;
    SEQ_MANUAL = c.seq; lsSet('torre_seq', String(c.seq));
    if (primeira) return;                               // 1ª leitura da página: só marca a linha de base (não repete chamada antiga)
    const i = Object.assign({}, c.item);
    i.etapa = TXT_CHAMADA[i.etapa] ? i.etapa : 'apresentou';
    if (!ETAPA[i.etapa]) return; chamar(i);
  }catch(e){}
}
/* chamada: nome em placas, centralizado; nomes longos ganham placas menores para não cortar */
const centro = (txt, n) => { const t = [...String(txt||'')].slice(0,n).join(''); return ' '.repeat(Math.floor((n - t.length)/2)) + t; };
function placasCentro(txt, nMin, wMax, largura, cls){
  const n = Math.max(nMin, [...String(txt||'')].length), w = Math.min(wMax, largura/n - .14);
  return Placas.html(n, '', cls + ' tnum', n > nMin ? `--w:${w.toFixed(2)}rem;--h:${(w*1.8).toFixed(2)}rem;--fs:${(w*1.46).toFixed(2)}rem` : '');
}
function proxima(){
  const i = FILA.shift(); const box = $('#chamada');
  if (!i){ EM_TELA=false; box.classList.remove('on'); return; }
  EM_TELA = true;
  const q = QUADROS[i.funil], cor = ETAPA[i.etapa].cor;
  const transp = bonito(i.transportadora).toUpperCase() || 'TRANSPORTADORA';
  const qt = i.qtd ? `${i.qtd} ${i.tipo==='Paletes'?'palete'+(+i.qtd===1?'':'s'):(+i.qtd===1?'volume':'volumes')}` : '';
  box.style.setProperty('--c', cor);
  const cliCh = (curto(i.cliente)||bonito(i.cliente)).toUpperCase();
  box.innerHTML = `<div class="ch" style="--c:${cor}">
      <div class="e">${esc(TXT_CHAMADA[i.etapa](q))}</div>
      <div class="tr">${placasCentro(transp, 26, 3.35, 92, 'z-chT')}</div>
      <div class="cl">${placasCentro(cliCh, 32, 2, 70, 'z-chC')}</div>
      <div class="ib">${/cross/i.test(i.operacao||'')?`<span class="cross">CROSSDOCKING</span>`:''}${i.doca&&i.etapa==='em_andamento'&&!/cross/i.test(i.operacao||'')?`<span class="doca">DOCA ${esc(i.doca)}</span>`:''}${i.placa?`<span>${esc(i.placa)}</span>`:''}${qt?`<span>${esc(qt)}</span>`:''}</div>
      ${FILA.length?`<div class="fila">+ ${FILA.length} na fila de chamada</div>`:''}</div>`;
  box.classList.add('on');
  setTimeout(()=>{ const f = box.querySelectorAll('.ch .fl'); Placas.troca(f[0], centro(transp, +f[0].dataset.n)); Placas.troca(f[1], centro(cliCh, +f[1].dataset.n), 250); }, 200);
  campainha();
  const frase = fraseChamada(i);
  setTimeout(()=>falar(frase), 2400);
  setTimeout(proxima, CFG.chamadaSeg*1000);
}

/* ---- detecta quem mudou de etapa desde a última leitura ---- */
let VISTOS = null;
function detectar(){
  const chave = i => `${i.id}:${i.etapa}`;
  const hoje = DADOS.hoje || '';
  const salvo = (()=>{ try{ const j = JSON.parse(lsGet('torre_vistos')||'null'); return j && j.dia===hoje ? new Set(j.k) : null; }catch(e){return null} })();
  const eventos = DADOS.itens.filter(i=>(i.funil==='exp'?CFG.chamarExp:CFG.chamarRec).includes(i.etapa));
  if (VISTOS === null){
    VISTOS = salvo || new Set(DADOS.itens.map(chave));      // 1ª vez no dia: não chama o que já estava lá
  } else {
    for (const i of eventos){
      if (VISTOS.has(chave(i))) continue;
      const t = quando(i.movido); const idadeMin = t ? (Date.now()-t)/60000 : 0;
      if (idadeMin <= CFG.maxAtrasoChamadaMin) chamar(i);
    }
    DADOS.itens.forEach(i=>VISTOS.add(chave(i)));
  }
  lsSet('torre_vistos', JSON.stringify({dia:hoje, k:[...VISTOS]}));
}

/* =====================================================================
   DADOS
   ===================================================================== */
async function carregar(){
  if (DEMO) return simular();
  if (!CFG.api) throw new Error('Falta configurar o endereço do proxy (config.js).');
  const r = await fetch(`${CFG.api}${CFG.api.includes('?')?'&':'?'}t=${encodeURIComponent(TOKEN)}`, {cache:'no-store'});
  if (r.status === 401) throw new Error('Token da torre inválido — abra a página com ?t=SEU_TOKEN');
  if (!r.ok) throw new Error('Proxy respondeu ' + r.status);
  return r.json();
}
async function ciclo(){
  try{
    const d = await carregar(); DADOS = d; ULTIMO_OK = new Date(); FALHA_DESDE = null;
    $('#erro').style.display='none';
    if (MODO_ATUAL) desenhar(); detectar();
  }catch(e){
    FALHA_DESDE = FALHA_DESDE || new Date();
    $('#erro').textContent = '⚠ ' + (e.message||e); $('#erro').style.display='block';
  }
  const led = $('#led'), st = $('#estado');
  if (DEMO){ led.className='led demo'; st.textContent = 'DEMONSTRAÇÃO — dados fictícios'; }
  else if (FALHA_DESDE){ led.className='led off'; st.textContent = 'SEM CONEXÃO desde ' + parte(FALHA_DESDE,{hour:'2-digit',minute:'2-digit',hour12:false}) + (ULTIMO_OK?` · últimos dados ${parte(ULTIMO_OK,{hour:'2-digit',minute:'2-digit',hour12:false})}`:''); }
  else { led.className='led'; st.textContent = 'atualizado às ' + parte(ULTIMO_OK,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}); }
}

/* =====================================================================
   DEMONSTRAÇÃO (dados fictícios, sem Bitrix24)
   ===================================================================== */
const SIM = {itens:null, prox:0};
function simular(){
  const agora = new Date();
  const f = d => parte(d,{year:'numeric',month:'2-digit',day:'2-digit'}).split('/').reverse().join('-');
  const ts = d => f(d)+' '+parte(d,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const hoje = f(agora), min = m => ts(new Date(agora.getTime()-m*60000));
  const modo = MODO();
  if (!SIM.itens){
    const T=['Expresso Litoral','Transcapixaba','LogES Cargas','Rodovale','Frota Serrana','Costa Azul Log','Norte Capixaba','Via Sul Transportes','Cargo Rápido','Atlântico Log'];
    const C=['Cosméticos Aurora Ltda','Farma Vitória Distribuidora','Indústria Mar & Sol Ltda','Eletro Capixaba S/A','Química Santa Cruz Ltda','Papelaria Central Eireli','Brasil Cabos Ltda','Higiene Plus Comércio Ltda'];
    let id=9000; const mk=(funil,etapa,mAtras,extra={})=>({id:id++,funil,etapa,cliente:C[id%C.length],transportadora:T[(id*3)%T.length],
        placa:'ABC'+(1000+id%9000).toString().replace(/^(\d)/,'$1D').slice(0,4),motorista:'',doca:'',dataAg:hoje,chegada:'',inicio:'',fim:'',movido:min(mAtras),
        conferente:'',tipo:id%2?'Paletes':'Volumes',qtd:String(4+id%25),obs:'',doDiaAnterior:false,...extra});
    SIM.mk = mk;
    SIM.itens = [
      ...Array.from({length:6},()=>mk('rec','agendado',600)),
      mk('rec','apresentou',12,{chegada:min(12)}), mk('rec','apresentou',41,{chegada:min(41)}),
      mk('rec','aguardando_doca',35,{chegada:min(35)}), mk('rec','aguardando_doca',72,{chegada:min(72)}),
      mk('rec','em_andamento',20,{chegada:min(50),inicio:min(20),doca:'02',conferente:'Mateus Santos'}), mk('rec','em_andamento',8,{chegada:min(30),inicio:min(8),doca:'05',conferente:'Greziele Nascimento'}),
      ...Array.from({length:5},(_,k)=>mk('rec','concluido',60+k*30,{chegada:min(140+k*30),fim:min(60+k*30),doca:'0'+(1+k%4)})),
      mk('rec','nao_cumprido',100),
      mk('exp','apresentou',6,{chegada:min(6)}), mk('exp','aguardando_doca',18,{chegada:min(18)}),
      mk('exp','em_andamento',14,{chegada:min(40),inicio:min(14),doca:'03'}),
      ...Array.from({length:9},(_,k)=>mk('exp','concluido',30+k*22,{chegada:min(90+k*22),fim:min(30+k*22),doca:'0'+(1+k%5)})),
    ];
    SIM.t0 = Date.now(); SIM.passo = 0;
  }
  // a cada ~25 s alguém avança de etapa (para ver a chamada acontecer)
  const passos = Math.floor((Date.now()-SIM.t0)/25000);
  while (SIM.passo < passos){
    SIM.passo++;
    const ordem = ['agendado','apresentou','aguardando_doca','em_andamento','concluido'];
    const alvo = SIM.itens.find(i=>i.funil===modo && i.etapa==='agendado') || SIM.itens.find(i=>i.funil===modo && i.etapa==='apresentou');
    if (alvo){
      const e = ordem[ordem.indexOf(alvo.etapa)+1]; alvo.etapa = e; alvo.movido = min(0);
      if (e==='apresentou') alvo.chegada = min(0);
      if (e==='em_andamento'){ alvo.inicio = min(0); alvo.doca = '0'+(1+SIM.passo%5); alvo.conferente='Mateus Santos'; }
    }
  }
  return {geradoEm:agora.toISOString(), hoje, itens:SIM.itens, futuros:{[f(new Date(agora.getTime()+864e5))]:11,[f(new Date(agora.getTime()+2*864e5))]:6}};
}

/* =====================================================================
   INÍCIO
   ===================================================================== */
document.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if (k==='r'){MODO_FORCADO='rec'} else if (k==='e'){MODO_FORCADO='exp'} else if (k==='a'){MODO_FORCADO=''} else if (k==='k'){ KPI_ON ? kpiFechar() : kpiAbrir(true); } else if (k==='d'){ diag('', true); } else if (k==='p'){ KPI_ON ? kpiFechar() : kpiAbrir(true, 'amanha'); } else if (k==='v'){ ESTILO = ESTILO==='painel'?'quadro':'painel'; montar(MODO()); }
  else if (k==='t'){ ativarSom(); TESTE_N++; const base = DADOS.itens.find(i=>i.funil===MODO() && i.etapa==='apresentou') || DADOS.itens.find(i=>i.funil===MODO()) || {funil:MODO(),transportadora:'Jomed Transportes',cliente:'Semina Industria e Comercio Ltda',doca:'03',placa:'TST1A23',tipo:'Paletes',qtd:'10'};
    chamar(Object.assign({}, base, {funil:MODO(), etapa: TESTE_N%2 ? (MODO()==='exp'?'aguardando_doca':'apresentou') : 'em_andamento', doca: base.doca || '03'})); }
  relogio();
});
$('#som').addEventListener('click', ()=>{ ativarSom(); if(SOM_OK){ campainha(); falar('Som do controle de pátio ativo.'); } });
document.addEventListener('click', ()=>{ if(!SOM_OK) ativarSom(); }, {once:false});

function iniciar(){
  montar(MODO()); relogio(); setInterval(relogio, 1000);
  ciclo(); setInterval(ciclo, CFG.intervalo*1000);
  ouvirManual(); setInterval(ouvirManual, 4000);
  requestAnimationFrame(rolar); setInterval(atualizaBotaoSom, 2000);
}
// tenta liberar o som sozinho (funciona se o Chrome foi aberto com --autoplay-policy=no-user-gesture-required)
try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
if (AC && AC.state === 'running') { SOM_OK = true; iniciar(); atualizaBotaoSom(); }
else if (AC) { AC.resume().then(()=>{ SOM_OK = AC.state==='running'; }).catch(()=>{}); iniciar(); setTimeout(atualizaBotaoSom,500); }
else iniciar();
</script>
